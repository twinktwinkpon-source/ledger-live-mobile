name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods specs + Pods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            apps/ledger-live-mobile/ios/Pods
            apps/ledger-live-mobile/ios/build
          key: pods-${{ runner.os }}-${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Stub postinstall + .env
        run: |
          cd apps/ledger-live-mobile
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.scripts=j.scripts||{};j.scripts.postinstall='echo [ci] postinstall stubbed';fs.writeFileSync(p,JSON.stringify(j,null,2));"
          if [ ! -f .env ]; then
            echo 'APP_NAME="LL [CI BUILD]"' > .env
            echo 'ANALYTICS_TOKEN="stub"' >> .env
            echo 'BRAZE_ANDROID_API_KEY="stub"' >> .env
            echo 'BRAZE_IOS_API_KEY="stub"' >> .env
            echo 'BRAZE_CUSTOM_ENDPOINT="stub"' >> .env
          fi

      - name: Install root deps
        run: pnpm install --filter="live-mobile..." --filter="ledger-live" --unsafe-perm
        timeout-minutes: 60

      - name: Build mobile deps (incl. native-ui fonts into lib/)
        run: pnpm build:llm:deps
        timeout-minutes: 60

      - name: Generate families dispatch files
        run: ./node_modules/.bin/zx apps/ledger-live-mobile/scripts/sync-families-dispatch.mjs

      - name: Setup Ruby + CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: bundle install
        working-directory: apps/ledger-live-mobile
      - name: List available Xcode versions
        run: |
          echo "=== Available Xcode versions ==="
          ls -d /Applications/Xcode_*.app 2>/dev/null || echo "No Xcode_*.app found"
          for x in /Applications/Xcode_*.app; do
            ver=$("$x/Contents/Developer/usr/bin/xcodebuild" -version 2>/dev/null | head -1)
            echo "  $x -> $ver"
          done
          echo ""
          echo "=== Default Xcode ==="
          xcode-select -p
          xcodebuild -version 2>/dev/null
          echo ""
          echo "=== Available iOS platforms ==="
          xcodebuild -showsdks 2>/dev/null || true

      - name: Pod install (with retry + backoff for 429 rate limits)
        working-directory: apps/ledger-live-mobile/ios
        run: |
          for i in 1 2 3 4 5 6; do
            echo "=== pod install attempt $i ==="
            bundle exec pod install && exit 0
            # 429 = GitHub raw rate limit; wait longer (backoff) before retrying
            WAIT=$((60 * i))
            echo "Attempt $i failed, waiting ${WAIT}s before retry (GitHub 429 rate limit)..."
            sleep "$WAIT"
          done
          echo "All pod install attempts failed"
          exit 1

      - name: Bypass Repack rspack for CI (use Metro instead)
        working-directory: apps/ledger-live-mobile
        run: |
          # Repack's rspack bundle command crashes in CI (stats.has_errors is not a function).
          # Patch react-native.config.js to use the default Metro bundler instead.
          node -e "
            const fs = require('fs');
            const p = 'react-native.config.js';
            let src = fs.readFileSync(p, 'utf8');
            // Remove the Repack commands override
            src = src.replace(/commands:\s*require\(['\"]@callstack\/repack\/commands\/rspack['\"]\),?\s*\n?/, '');
            fs.writeFileSync(p, src);
            console.log('Patched react-native.config.js — Repack commands override removed');
          "
          cat react-native.config.js

      - name: Build iOS (unsigned, skip JS bundling)
        working-directory: apps/ledger-live-mobile
        run: |
          cd ios
          unset CC CXX
          export SKIP_JS_BUNDLING=true
          xcodebuild \
            -workspace ledgerlivemobile.xcworkspace \
            -scheme ledgerlivemobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -UseModernBuildSystem=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Bundle JS with Metro
        working-directory: apps/ledger-live-mobile
        run: |
          echo "=== Bundling JS with Metro ==="
          npx react-native bundle \
            --platform ios \
            --entry-file index.js \
            --bundle-output main.jsbundle \
            --dev false \
            --minify false
          ls -la main.jsbundle
          echo "=== Bundle size: $(wc -c < main.jsbundle) bytes ==="

      - name: Package .ipa
        working-directory: apps/ledger-live-mobile
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/ledgerlivemobile.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: .app not found at $APP"
            find ios/build -name "ledgerlivemobile.app" -type d 2>/dev/null || true
            exit 1
          fi
          # Inject JS bundle into the .app
          if [ -f main.jsbundle ]; then
            cp main.jsbundle "$APP/main.jsbundle"
            echo "Injected main.jsbundle into .app"
          else
            echo "ERROR: main.jsbundle not found — IPA will have no JS bundle"
            exit 1
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -r "$GITHUB_WORKSPACE/LedgerWallet.ipa" Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LedgerWallet-ipa
          path: LedgerWallet.ipa
