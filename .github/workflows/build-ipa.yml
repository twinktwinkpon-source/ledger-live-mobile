name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: ipa-build
  cancel-in-progress: true

jobs:
  build-ipa:
    runs-on: macos-15
    timeout-minutes: 180
    env:
      NODE_OPTIONS: "--max-old-space-size=7168"
      LANG: en_US.UTF-8
      LANGUAGE: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - name: Cache CocoaPods specs + Pods
        uses: actions/cache@v4
        with:
          path: |
            ~/.cocoapods/repos
            apps/ledger-live-mobile/ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('apps/ledger-live-mobile/ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Stub postinstall + .env
        run: |
          cd apps/ledger-live-mobile
          node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p));j.scripts=j.scripts||{};j.scripts.postinstall='echo [ci] postinstall stubbed';fs.writeFileSync(p,JSON.stringify(j,null,2));"
          if [ ! -f .env ]; then
            echo 'APP_NAME="LL [CI BUILD]"' > .env
            echo 'ANALYTICS_TOKEN="stub"' >> .env
            echo 'BRAZE_ANDROID_API_KEY="stub"' >> .env
            echo 'BRAZE_IOS_API_KEY="stub"' >> .env
            echo 'BRAZE_CUSTOM_ENDPOINT="stub"' >> .env
          fi

      - name: Install root deps
        run: pnpm install --filter="live-mobile..." --filter="ledger-live" --unsafe-perm
        timeout-minutes: 60

      - name: Build mobile deps (incl. native-ui fonts into lib/)
        run: pnpm build:llm:deps
        timeout-minutes: 60

      - name: Generate families dispatch files
        run: ./node_modules/.bin/zx apps/ledger-live-mobile/scripts/sync-families-dispatch.mjs

      - name: Setup Ruby + CocoaPods
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: bundle install
        working-directory: apps/ledger-live-mobile

      - name: Pod install (with retry + backoff for 429 rate limits)
        working-directory: apps/ledger-live-mobile/ios
        run: |
          for i in 1 2 3 4 5 6; do
            echo "=== pod install attempt $i ==="
            bundle exec pod install && exit 0
            WAIT=$((60 * i))
            echo "Attempt $i failed, waiting ${WAIT}s before retry (GitHub 429 rate limit)..."
            sleep "$WAIT"
          done
          echo "All pod install attempts failed"
          exit 1

      - name: Generate JS bundle (Repack/rspack) before Xcode phase
        working-directory: apps/ledger-live-mobile
        run: |
          # Generate the release JS bundle up front at the exact path the Xcode
          # "Bundle React Native code and images" phase expects
          # (build/generated/ios/index.bundle), plus main.jsbundle for packaging.
          mkdir -p build/generated/ios
          # Pre-create an empty sourcemap: Repack's rspack OutputPlugin lists
          # index.bundle.map in chunk auxiliary files but may not emit it, causing
          # AssetsCopyProcessor to throw ENOENT. configured compareBeforeEmit:false
          # makes rspack always re-emit the bundle regardless.
          touch build/generated/ios/index.bundle.map
          if [ -f main.jsbundle ]; then rm -f main.jsbundle; fi
          pnpm bundle:ios --dev false --minify false
          echo "=== generated bundle ==="
          ls -la build/generated/ios/ || true
          echo "=== main.jsbundle size: $(wc -c < main.jsbundle) bytes ==="
          ls -la main.jsbundle || { echo "bundle:ios did not produce main.jsbundle"; exit 1; }

      - name: Build iOS (unsigned)
        working-directory: apps/ledger-live-mobile
        run: |
          cd ios
          unset CC CXX
          # JS bundle was already generated by the step above; tell Xcode to skip
          # its own bundling phase (it would otherwise re-run Repack in a different
          # cwd and fail with ENOENT on build/generated/ios/index.bundle). The bundle
          # is injected into the .app during the Package step.
          export SKIP_JS_BUNDLING=true
          xcodebuild \
            -workspace ledgerlivemobile.xcworkspace \
            -scheme ledgerlivemobile \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -UseModernBuildSystem=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        working-directory: apps/ledger-live-mobile
        run: |
          APP="ios/build/Build/Products/Release-iphoneos/ledgerlivemobile.app"
          if [ ! -d "$APP" ]; then
            echo "ERROR: .app not found at $APP"
            find ios/build -name "ledgerlivemobile.app" -type d 2>/dev/null || true
            exit 1
          fi
          # Ensure the JS bundle is present inside the .app
          if [ -f main.jsbundle ]; then
            cp main.jsbundle "$APP/main.jsbundle"
            echo "Injected main.jsbundle into .app ($(wc -c < "$APP/main.jsbundle") bytes)"
          elif [ -f build/generated/ios/index.bundle ]; then
            cp build/generated/ios/index.bundle "$APP/main.jsbundle"
            echo "Injected index.bundle as main.jsbundle into .app"
          fi
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -r "$GITHUB_WORKSPACE/LedgerWallet.ipa" Payload

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LedgerWallet-ipa
          path: LedgerWallet.ipa
