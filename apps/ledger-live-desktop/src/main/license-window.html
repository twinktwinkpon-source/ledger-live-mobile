<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLEX — License Activation</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:linear-gradient(145deg,#0d0d12 0%,#111122 100%);
    color:#fff;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    height:100vh;
    padding:40px;
    user-select:none;
    overflow:hidden;
  }
  .card{
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    border-radius:16px;
    padding:40px 36px;
    width:100%;
    max-width:400px;
    text-align:center;
    box-shadow:0 8px 32px rgba(0,0,0,0.4);
  }
  .logo{width:56px;height:56px;margin-bottom:20px}
  h1{font-size:20px;font-weight:600;margin-bottom:4px}
  .sub{font-size:13px;color:rgba(255,255,255,.5);margin-bottom:28px;line-height:1.5}
  .input-group{width:100%;margin-bottom:14px}
  input{
    width:100%;padding:14px 16px;
    background:rgba(0,0,0,0.3);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:10px;
    color:#fff;font-size:15px;font-family:monospace;
    letter-spacing:1.5px;text-align:center;
    outline:none;transition:border-color .2s;
  }
  input:focus{border-color:#4a90d9}
  input::placeholder{color:rgba(255,255,255,.25)}
  .btn-group{display:flex;gap:10px;margin-top:4px}
  .btn{
    flex:1;padding:13px 12px;
    border:none;border-radius:10px;
    font-size:13px;font-weight:600;
    cursor:pointer;transition:all .2s;
  }
  .btn-primary{
    background:#4a90d9;color:#fff;
  }
  .btn-primary:hover{opacity:.85}
  .btn-secondary{
    background:rgba(255,255,255,0.06);color:rgba(255,255,255,.6);
  }
  .btn-secondary:hover{background:rgba(255,255,255,0.1);color:#fff}
  .btn:disabled{opacity:.4;cursor:wait}
  .err{color:#e94848;font-size:12px;margin-top:12px;text-align:center;min-height:20px;line-height:1.4}
  .success{color:#4ade80;font-size:12px;margin-top:12px;text-align:center;min-height:20px}
  .info{margin-top:20px;font-size:11px;color:rgba(255,255,255,.3);text-align:center;line-height:1.5}
  .hwid-box{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06)}
  .hwid-label{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px}
  .hwid-value{font-family:monospace;font-size:11px;word-break:break-all;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:10px;color:#4a90d9;cursor:pointer;min-height:18px}
  .hwid-value:hover{color:#7ab4ec}
  .sp{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.1);border-top-color:#4a90d9;border-radius:50%;animation:spin .8s linear infinite;margin-right:6px;vertical-align:middle}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <svg class="logo" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" stroke="#4a90d9" stroke-width="1.5"/><path d="M7 8L7 16M7 12L17 12M17 8L17 16" stroke="#4a90d9" stroke-width="2" stroke-linecap="round"/></svg>
  <h1>FLEX</h1>
  <p class="sub" id="subText">Enter your license key to activate<br>FLEX Desktop</p>
  <div class="input-group"><input type="text" id="keyInput" placeholder="FLEX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false"/></div>
  <div class="btn-group">
    <button class="btn btn-primary" id="activateBtn" onclick="activate()"><span id="btnLabel">Activate License</span></button>
    <!-- FLEX_OPERATOR_ONLY_START -->
    <button class="btn btn-secondary" id="devBtn" onclick="devKey()" style="display:none">Dev License</button>
    <!-- FLEX_OPERATOR_ONLY_END -->
  </div>
  <!-- FLEX_OPERATOR_ONLY_START -->
  <button class="btn btn-secondary" id="offlineBtn" onclick="offlineActivate()" style="width:100%;margin-top:12px">Offline Activate (Operator)</button>
  <!-- FLEX_OPERATOR_ONLY_END -->
  <div class="err" id="errorEl"></div>
  <div class="success" id="successEl"></div>
  <div class="info" id="infoText">Your license is bound to this device's hardware.<br>Each key works on one machine only.</div>
  <button class="btn btn-secondary" id="hwidRevealBtn" onclick="showHwid()" style="width:100%;margin-top:14px">Show my HWID</button>
  <div class="hwid-box" id="hwidBox" style="display:none">
    <div class="hwid-label" id="hwidLabel">Your device HWID (send to operator):</div>
    <div class="hwid-value" id="hwidValue" onclick="copyHwid()"></div>
    <button class="btn btn-secondary" id="hwidBtn" onclick="copyHwid()" style="margin-top:10px">Copy HWID</button>
  </div>
  </div>
</div>
<script>
const { ipcRenderer } = require("electron");
const keyInput = document.getElementById("keyInput");
const activateBtn = document.getElementById("activateBtn");
const btnLabel = document.getElementById("btnLabel");
const errorEl = document.getElementById("errorEl");
const successEl = document.getElementById("successEl");

// ─── Minimal localization (RU system → RU window, EN otherwise) ───
// The main process passes app.getLocale() as a query param, same mechanism
// as the main renderer window (window-lifecycle.ts loadWindow()).
const L10N = {
  en: {
    subText: 'Enter your license key to activate<br>FLEX Desktop',
    infoText: "Your license is bound to this device's hardware.<br>Each key works on one machine only.",
    hwidLabel: "Your device HWID (send to operator):",
    activateLicense: "Activate License",
    activating: "Activating…",
    activatedClosing: "License activated! Closing…",
    activationFailed: "Activation failed",
    enterKey: "Please enter a license key",
    keyTooShort: "Key is too short",
    offlineActivating: "Activating offline…",
    offlineActivated: "Offline activated! Closing…",
    offlineFailed: "Offline activation failed",
    copied: "Copied!",
    couldNotReadHwid: "Could not read HWID",
  },
  ru: {
    subText: 'Введите лицензионный ключ для активации<br>FLEX Desktop',
    infoText: "Лицензия привязана к оборудованию этого устройства.<br>Каждый ключ работает только на одной машине.",
    hwidLabel: "HWID вашего устройства (отправьте оператору):",
    activateLicense: "Активировать лицензию",
    activating: "Активация…",
    activatedClosing: "Лицензия активирована! Закрытие…",
    activationFailed: "Не удалось активировать лицензию",
    enterKey: "Пожалуйста, введите лицензионный ключ",
    keyTooShort: "Ключ слишком короткий",
    offlineActivating: "Офлайн-активация…",
    offlineActivated: "Офлайн-активация выполнена! Закрытие…",
    offlineFailed: "Не удалось выполнить офлайн-активацию",
    copied: "Скопировано!",
    couldNotReadHwid: "Не удалось прочитать HWID",
  },
};
const sysLang = (new URLSearchParams(window.location.search).get("appLocale") || navigator.language || "").toLowerCase();
const T = L10N[sysLang.startsWith("ru") ? "ru" : "en"];

(function applyL10n() {
  const byId = id => document.getElementById(id);
  if (byId("subText")) byId("subText").innerHTML = T.subText;
  if (byId("infoText")) byId("infoText").innerHTML = T.infoText;
  if (byId("hwidLabel")) byId("hwidLabel").textContent = T.hwidLabel;
  if (byId("btnLabel") && !activateBtn.disabled) byId("btnLabel").textContent = T.activateLicense;
  if (byId("offlineBtn") && sysLang.startsWith("ru")) {
    byId("offlineBtn").textContent = "Офлайн-активация (оператор)";
  }
})();

function setBusy(busy, label) {
  activateBtn.disabled = busy;
  btnLabel.innerHTML = busy
    ? '<span class="sp"></span>' + (label || T.activating)
    : label || T.activateLicense;
  if (!busy) { errorEl.textContent = ""; successEl.textContent = ""; }
}

function showError(msg) { errorEl.textContent = msg; successEl.textContent = ""; }
function showSuccess(msg) { successEl.textContent = msg; errorEl.textContent = ""; }

function activate() {
  const key = keyInput.value.trim().toUpperCase().replace(/[^A-Z0-9-]/g, "");
  if (!key) { showError(T.enterKey); return; }
  if (key.length < 12) { showError(T.keyTooShort); return; }
  setBusy(true);
  ipcRenderer.invoke("license:activate", key)
    .then(r => {
      if (r && r.valid) { showSuccess(T.activatedClosing); setTimeout(() => window.close(), 500); }
      else { setBusy(false); showError(r?.error || T.activationFailed); }
    })
    .catch(e => { setBusy(false); showError(T.activationFailed + ": " + e.message); });
}

keyInput.addEventListener("keydown", e => { if (e.key === "Enter") activate(); });

// FLEX_OPERATOR_ONLY_START
function offlineActivate() {
  setBusy(true, T.offlineActivating);
  ipcRenderer.invoke("license:offline-activate").then(r => {
    if (r && r.valid) { showSuccess(T.offlineActivated); setTimeout(() => window.close(), 500); }
    else { setBusy(false); showError(r?.error || T.offlineFailed); }
  }).catch(e => { setBusy(false); showError(T.offlineFailed + ": " + e.message); });
}
// FLEX_OPERATOR_ONLY_END

// FLEX_OPERATOR_ONLY_START
// Show the Dev License button only when the local dev server is available
ipcRenderer.invoke("license:is-dev").then(isDev => {
  if (isDev) document.getElementById("devBtn").style.display = "";
});
// FLEX_OPERATOR_ONLY_END
keyInput.addEventListener("input", e => {
  e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9-]/g, "");
});

function showHwid() {
  ipcRenderer.invoke("license:get-raw-hwid").then(hwid => {
    if (!hwid) { showError(T.couldNotReadHwid); return; }
    document.getElementById("hwidValue").textContent = hwid;
    document.getElementById("hwidBox").style.display = "block";
  }).catch(e => showError(T.couldNotReadHwid + ": " + e.message));
}

function copyHwid() {
  const v = document.getElementById("hwidValue").textContent;
  if (v) {
    require("electron").clipboard.writeText(v);
    const btn = document.getElementById("hwidBtn");
    const old = btn.textContent;
    btn.textContent = T.copied;
    setTimeout(() => { btn.textContent = old; }, 1200);
  }
}

ipcRenderer.on("license:error", (_event, msg) => {
  setBusy(false);
  showError(msg || T.activationFailed);
});
</script>
</body>
</html>
