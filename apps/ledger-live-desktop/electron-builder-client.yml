appId: com.ledger.live.client

protocols:
  name: Ledger Wallet
  schemes:
    - ledgerlive
    - ledgerwallet

afterSign: scripts/notarize.js
afterPack: scripts/afterPack.js

mac:
  artifactName: LedgerWallet-Client-${version}-${os}.${ext}
  category: public.app-category.wallet
  hardenedRuntime: true
  entitlements: build/mac/entitlements.plist
  entitlementsInherit: build/mac/entitlements.plist
  target:
    - target: dmg
      arch:
        - universal
    - target: zip
      arch:
        - universal

linux:
  artifactName: LedgerWallet-Client-${version}-${os}-${arch}.${ext}
  category: Finance
  target:
    - target: AppImage
      arch:
        - x64

win:
  artifactName: LedgerWallet-Client-${version}-${os}-${arch}.${ext}
  icon: build/windows/app.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  installerIcon: build/windows/installer.ico
  installerSidebar: build/windows/installerSidebar.bmp
  uninstallerIcon: build/windows/uninstaller.ico
  uninstallerSidebar: build/windows/uninstallerSidebar.bmp

files:
  - .webpack/**/*
  - "!.webpack/**/*.js.map"
  - "!.webpack/keygen.html"
  - "node_modules/@ledgerhq/zcash-utils/**/*"
  - from: "dist/node_modules"
    to: "node_modules"
    filter:
      - "**/*"
      - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
      - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
      - "!**/node_modules/*.d.ts"
      - "!**/node_modules/.bin"
      - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
      - "!.editorconfig"
      - "!**/._*"
      - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
      - "!**/{__pycache__,thumbs.db,.idea,.vs,.nyc_output}"
      - "!**/{appveyor.yml,.travis.yml,circle.yml}"
      - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"
      - "!**/Makefile"
      - "!**/*.{gyp,gypi,mk,Makefile}"
      - "!**/build/**/*"
      - "**/build/**/*.{js,cjs,mjs}"
      - "**/*.node"
  - "!node_modules"

buildDependenciesFromSource: false
npmRebuild: false

publish:
  - provider: generic
    url: https://download.live.ledger.com

asarUnpack:
  - "node_modules/@ledgerhq/zcash-utils/**/*"
  - ".webpack/server/**/*"
